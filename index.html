<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uwubloom Mini Cake</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#fff7f8;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

.logo{
display:block;
margin:auto;
width:300px;
}

h1{
text-align:center;
margin:10px 0;
color:#9b6d28;
}

.produk-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
position:relative;
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card h3{
padding:15px;
text-align:center;
color:#444;
}

.badge{
position:absolute;
top:15px;
left:15px;
background:#ff4f81;
color:white;
padding:8px 14px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.harga{
text-align:center;
}

.harga-coret{
text-decoration:line-through;
color:#999;
}

.diskon{
background:red;
color:white;
padding:3px 8px;
border-radius:10px;
font-size:12px;
margin-left:5px;
}

.harga-baru{
text-align:center;
font-size:28px;
font-weight:bold;
color:#ff4f81;
margin:10px 0;
}

.btn-order{
display:block;
width:80%;
margin:15px auto 20px;
padding:12px;
background:#ff9ab7;
color:white;
text-align:center;
border-radius:25px;
text-decoration:none;
transition:.3s;
}

.btn-order:hover{
background:#ff4f81;
}

.btn-order:active{
transform:scale(.95);
}

.floating-wa{
position:fixed;
right:20px;
bottom:20px;
width:65px;
height:65px;
background:#25D366;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:35px;
color:white;
text-decoration:none;
box-shadow:0 0 20px rgba(0,0,0,.3);

animation:pulse 1.5s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.15);
}

100%{
transform:scale(1);
}

}

</style>

</head>
<body>

<div class="container">

<img src="img/logo.png" class="logo">

<h1>Katalog Mini Cake</h1>

<div class="produk-grid">

    <!-- Produk 1 -->
    <div class="card bestseller">

        <span class="badge">
            BEST SELLER 🔥
        </span>

        <img src="img/cake1.jpeg">

        <h3>Mini Cake Choco</h3>

        <div class="harga">

            <span class="harga-coret">
                Rp50.000
            </span>

            <span class="diskon">
                -30%
            </span>

        </div>

        <div class="harga-baru">
            Rp35.000
        </div>

       <a
        href="#"
        onclick="tanyaProduk('Mini Cake Choco')"
        class="btn-order">

        Tanyakan

        </a>

    </div>

    <!-- Produk 2 -->
    <div class="card">

        <img src="img/cake2.jpeg">

        <h3>Mini Cake Strawberry</h3>

        <div class="harga">
            <span class="harga-coret">
                Rp50.000
            </span>

            <span class="diskon">
                -30%
            </span>
        </div>

        <div class="harga-baru">
            Rp35.000
        </div>

        <a
        href="#"
        onclick="tanyaProduk('Mini Cake Strawberry')"
        class="btn-order">

        Tanyakan

        </a>

    </div>

</div>
<script>
function tanyaProduk(produk){

let pesan =
`Halo Kak 👋

Saya tertarik dengan produk:

🍰 ${produk}

Apakah masih tersedia?

Mohon info detail harga, jadwal pengambilan, dan cara pemesanannya ya 😊`;

window.open(
"https://wa.me/6285704224184?text=" +
encodeURIComponent(pesan),
"_blank"
);

}
</script>
</div>

<!-- Floating WA -->

</body>
</html>
